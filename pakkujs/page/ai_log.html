<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>super-danmuku :: AI 过滤日志</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 960px;
            margin: 24px auto;
            padding: 0 16px;
            color: #222;
        }
        .bar {
            margin: 16px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        button {
            padding: 4px 16px;
            cursor: pointer;
        }
        #summary {
            opacity: .7;
            font-size: .9em;
        }
        #empty {
            opacity: .7;
            margin: 24px 0;
        }
        #log-view {
            display: none;
            max-height: 70vh;
            overflow: auto;
            font-family: ui-monospace, monospace;
            font-size: 12px;
            line-height: 1.6;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 8px;
            white-space: pre-wrap;
            word-break: break-all;
            background: #fafafa;
        }
        a {
            color: #0066cc;
        }
    </style>
</head>
<body>
    <h2>AI 过滤日志</h2>
    <p>
        记录每个时间窗的判定明细（文本、合并数、删除概率、质量分、删/汰/留、耗时与错误原因）和每个分片的汇总。
        保存在本浏览器（最多 300 条），不含 API key。
        如果感觉"没有过滤"，先看这里：候选全部"留"说明模型判定保留（可调低删除阈值），
        出现"错误"说明 API 调用失败（检查 key 与网络），没有任何记录说明过滤层没有运行（检查开关与 key）。
    </p>
    <div class="bar">
        <button id="refresh">刷新</button>
        <button id="clear">清空</button>
        <button id="export">导出 JSON</button>
        <span id="summary"></span>
    </div>
    <p id="empty">暂无记录。打开一个视频并启用 AI 过滤后再来刷新。</p>
    <div id="log-view"></div>
    <p><a href="options.html">← 返回设置</a></p>

    <script type="module" src="/generated/ai_log.js"></script>
</body>
</html>
