name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version pakkujs/manifest.json)
          [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{3,4}\.[0-9]+$ ]] || {
            echo "Version must use YYYY.MDD.REVISION (got '$VERSION')" >&2
            exit 1
          }
          EXPECTED_PREFIX=$(TZ=Asia/Shanghai date '+%Y.%-m%d')
          [[ "$VERSION" == "$EXPECTED_PREFIX".* ]] || {
            echo "Version $VERSION does not match today's Asia/Shanghai date $EXPECTED_PREFIX" >&2
            exit 1
          }
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists, nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Will release $TAG."
          fi

  release:
    needs: validate
    if: needs.validate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Build extension packages
        run: |
          npm run build:chrome
          npm run build:firefox

      - name: Smoke test AI filter layer
        run: node tools/smoke_ai_filter.js

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p release
          mv dist/Chrome-super-danmuku.zip "release/super-danmuku-$VERSION-chrome.zip"
          mv dist/Firefox-super-danmuku.zip "release/super-danmuku-$VERSION-firefox.zip"
          (cd release && sha256sum super-danmuku-*.zip > SHA256SUMS)
          cat release/SHA256SUMS

      - name: Write release notes
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            PREV_TAG=$(git describe --tags --abbrev=0 "v$VERSION^" 2>/dev/null || true)
          else
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)
          fi
          if [[ -n "$PREV_TAG" ]]; then
            RANGE="$PREV_TAG..HEAD"
            COMPARE_URL="https://github.com/$GITHUB_REPOSITORY/compare/$PREV_TAG...v$VERSION"
          else
            RANGE="$(git rev-list --max-parents=0 HEAD)..HEAD"
            COMPARE_URL="https://github.com/$GITHUB_REPOSITORY/commits/v$VERSION"
          fi
          {
            echo "自动发布，包含以下变更："
            echo
            git log --oneline --no-decorate "$RANGE" | sed 's/^/- /'
            echo
            echo '## 安装'
            echo
            echo "- Chrome/Edge：下载 \`super-danmuku-$VERSION-chrome.zip\` 解压，在 \`chrome://extensions\` 开启开发者模式后「加载已解压的扩展程序」指向解压目录。"
            echo "- Firefox：下载 \`super-danmuku-$VERSION-firefox.zip\`，在 \`about:debugging\` → 「此 Firefox」→「临时载入附加组件」选择包内 manifest.json；未签名扩展持久安装需经 AMO 签名或使用开发者版。"
            echo
            echo "**Full Changelog**: $COMPARE_URL"
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub release
        run: |
          set -euo pipefail
          ARGS=(--repo "$GITHUB_REPOSITORY" --title "super-danmuku $VERSION" --notes-file release-notes.md)
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            gh release create "v$VERSION" release/* --verify-tag "${ARGS[@]}"
          else
            gh release create "v$VERSION" release/* --target "$GITHUB_SHA" "${ARGS[@]}"
          fi

  publish-amo:
    name: Publish new version to addons.mozilla.org
    needs: [validate, release]
    if: needs.validate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Build Firefox package
        run: |
          npm install
          npm run build:firefox

      - name: Create source archive for AMO review
        run: git archive --format=zip -o source-code.zip HEAD

      - name: Sign and submit new version to AMO
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${WEB_EXT_API_KEY:-}" || -z "${WEB_EXT_API_SECRET:-}" ]]; then
            echo "WEB_EXT_API_KEY / WEB_EXT_API_SECRET not configured; skipping AMO publish."
            echo "Get them at https://addons.mozilla.org/developers/addon/api/key/ (owner of the AMO listing)."
            exit 0
          fi
          npx --yes web-ext sign \
            --channel=listed \
            --no-input \
            --source-dir dist/F \
            --artifacts-dir web-ext-artifacts \
            --upload-source-code source-code.zip \
            --api-key "$WEB_EXT_API_KEY" \
            --api-secret "$WEB_EXT_API_SECRET"

  publish-cws:
    name: Publish new version to Chrome Web Store
    needs: [validate, release]
    if: needs.validate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Download Chrome package from the release
        run: |
          set -euo pipefail
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            -p "super-danmuku-$VERSION-chrome.zip" -O chrome.zip

      - name: Upload and publish via Chrome Web Store API v2
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CWS_CLIENT_ID:-}" || -z "${CWS_CLIENT_SECRET:-}" || -z "${CWS_REFRESH_TOKEN:-}" \
             || -z "${CWS_EXTENSION_ID:-}" || -z "${CWS_PUBLISHER_ID:-}" ]]; then
            echo "CWS credentials not configured; skipping Chrome Web Store publish."
            echo "Need secrets CWS_CLIENT_ID / CWS_CLIENT_SECRET / CWS_REFRESH_TOKEN and"
            echo "variables CWS_EXTENSION_ID / CWS_PUBLISHER_ID. See"
            echo "https://developer.chrome.com/docs/webstore/using-api"
            exit 0
          fi
          ACCESS_TOKEN=$(curl -sS -X POST https://oauth2.googleapis.com/token \
            --data-urlencode grant_type=refresh_token \
            --data-urlencode refresh_token="$CWS_REFRESH_TOKEN" \
            --data-urlencode client_id="$CWS_CLIENT_ID" \
            --data-urlencode client_secret="$CWS_CLIENT_SECRET" \
            | jq -r '.access_token // empty')
          [[ -n "$ACCESS_TOKEN" ]] || { echo "Failed to exchange refresh token for access token" >&2; exit 1; }
          BASE="https://chromewebstore.googleapis.com"
          echo "== CWS upload =="
          HTTP_CODE=$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $ACCESS_TOKEN" -X POST -T chrome.zip \
            "$BASE/upload/v2/publishers/$CWS_PUBLISHER_ID/items/$CWS_EXTENSION_ID:upload")
          cat response.json; echo
          [[ "$HTTP_CODE" == 2* ]] || { echo "CWS upload failed with HTTP $HTTP_CODE" >&2; exit 1; }

          echo "== CWS publish =="
          HTTP_CODE=$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $ACCESS_TOKEN" -X POST \
            "$BASE/v2/publishers/$CWS_PUBLISHER_ID/items/$CWS_EXTENSION_ID:publish")
          cat response.json; echo
          [[ "$HTTP_CODE" == 2* ]] || { echo "CWS publish failed with HTTP $HTTP_CODE" >&2; exit 1; }

