name: Bug 反馈
description: 报告扩展的 bug
body:
  - type: markdown
    attributes:
      value: |
        请**完整**填写以下信息，信息不完整导致无法复现的 bug 反馈将直接标为 invalid 并关闭。
  - type: input
    id: is_reproducible
    attributes:
      label: 是否可以稳定复现
      description: 问题是否每次都出现？刷新网页、重启浏览器、更换网络环境、重装扩展之后是否问题还在？
      placeholder: …
    validations:
      required: true
  - type: textarea
    id: step_to_reproduce
    attributes:
      label: 复现步骤
      description: 请描述问题出现时的具体操作步骤，如果是特定视频有问题，请附链接。
      placeholder: |
        1. …
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: 预期行为
      description: 进行上述操作以后，你觉得应该出现什么行为？
      placeholder: …
    validations:
      required: true
  - type: textarea
    id: actually_behavior
    attributes:
      label: 实际行为
      description: 实际发生了什么？如果有报错信息或截图，请一并附上。AI 过滤相关的问题可以在设置页导出判定日志后附上。
      placeholder: …
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境信息
      description: 浏览器及版本、扩展版本（设置页右上角可见）、是否启用了 AI 弹幕过滤。
      placeholder: 例如：Chrome 130 / super-danmuku 2026.918.12 / AI 过滤已开启
    validations:
      required: true
