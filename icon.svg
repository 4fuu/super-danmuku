<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- super-danmuku: AI danmaku quality filter -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#282e3c"/>
      <stop offset="1" stop-color="#171b25"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- incoming danmaku: cluttered, mixed quality -->
  <rect x="24" y="22" width="40" height="10" rx="5" fill="#fb7299"/>
  <rect x="70" y="22" width="24" height="10" rx="5" fill="#59627a"/>
  <rect x="30" y="38" width="28" height="10" rx="5" fill="#59627a" opacity=".7"/>
  <rect x="64" y="38" width="34" height="10" rx="5" fill="#ffffff" opacity=".45"/>
  <!-- filter funnel -->
  <path d="M32 58 h64 l-22 26 v24 h-20 v-24 z" fill="#fb7299"/>
  <!-- filtered output: one clean bar -->
  <rect x="40" y="114" width="48" height="8" rx="4" fill="#ffffff"/>
</svg>
